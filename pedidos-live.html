<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:image" content="https://lobo24-9e46b.web.app/imagenes/iconoLobo24.png">

<title>Pedidos en Vivo | Lobo24</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="imagenes/iconoLobo24.png">

<style>

:root{
    --bg:#0f0f14;
    --bg2:#181822;
    --card:#1f1f2b;
    --border:#2f2f40;
    --accent:#f0c040;
    --green:#35d07f;
    --red:#ff5d5d;
    --text:#f5f5f5;
    --muted:#999;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
}

header{
    padding:20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#111;
}

header h1{
    font-size:28px;
    color:var(--accent);
}

#pedidoCount{
    background:var(--accent);
    color:#000;
    padding:6px 12px;
    border-radius:10px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.pedidos-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.pedido-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    position:relative;
}

.status{
    position:absolute;
    top:12px;
    right:12px;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.status.pendiente{
    background:#ff9800;
    color:#000;
}

.status.preparacion{
    background:#2196f3;
}

.status.entregado{
    background:var(--green);
    color:#000;
}

.pedido-card h2{
    margin-bottom:10px;
    color:var(--accent);
}

.info{
    margin-bottom:8px;
    color:#ddd;
}

.info.fecha{
    color:var(--muted);
    font-size:13px;
}

.pickup-badge{
    display:inline-block;
    background:var(--accent);
    color:#000;
    font-weight:bold;
    font-size:12px;
    padding:4px 10px;
    border-radius:8px;
    margin-bottom:10px;
}

.mp-note{
    margin:10px 0;
    padding:10px 12px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
}

.mp-note.mp-wait{
    background:rgba(255,93,93,.12);
    border:1px solid rgba(255,93,93,.3);
    color:var(--red);
}

.mp-note.mp-ok{
    background:rgba(53,208,127,.12);
    border:1px solid rgba(53,208,127,.3);
    color:var(--green);
}

.total{
    font-size:26px;
    font-weight:bold;
    margin:15px 0;
    color:var(--green);
}

.items{
    margin-top:10px;
    border-top:1px solid var(--border);
    padding-top:10px;
}

.item{
    margin-bottom:6px;
    color:#ccc;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.actions button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.btn-prep{
    background:#2196f3;
    color:#fff;
}

.btn-entregado{
    background:var(--green);
    color:#000;
}

.actions button:hover{
    opacity:.85;
}

.empty{
    text-align:center;
    margin-top:80px;
    color:var(--muted);
    font-size:18px;
}

#soundGate,
#alertModal{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
}

#soundGate{
    background:rgba(0,0,0,.92);
}

#soundGate.show,
#alertModal.show{
    display:flex;
}

.gate-box{
    max-width:420px;
}

.gate-icon{
    font-size:64px;
    margin-bottom:10px;
}

.gate-box p{
    color:#ccc;
    margin:12px 0 22px;
    line-height:1.4;
}

#enableAlertsBtn{
    background:var(--accent);
    color:#000;
    border:none;
    border-radius:14px;
    padding:18px 32px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#alertModal{
    background:#d50000;
    animation:alertFlash .7s steps(1) infinite;
}

@keyframes alertFlash{
    0%{ background:#d50000; }
    50%{ background:#ff9800; }
}

.alert-box{
    background:#fff;
    color:#111;
    border-radius:24px;
    padding:28px 24px;
    width:min(560px,100%);
    max-height:92vh;
    overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    animation:alertShake .6s ease-in-out infinite;
}

@keyframes alertShake{
    0%,100%{ transform:translateX(0) scale(1); }
    25%{ transform:translateX(-6px) scale(1.02); }
    75%{ transform:translateX(6px) scale(1.02); }
}

.alert-icon{
    font-size:72px;
    line-height:1;
}

.alert-box h2{
    font-size:38px;
    color:#d50000;
    margin:8px 0 14px;
}

.alert-extra{
    font-weight:bold;
    color:#b71c1c;
    margin-bottom:8px;
}

.alert-body{
    font-size:20px;
    line-height:1.5;
    margin-bottom:22px;
}

.alert-body .alert-total{
    font-size:34px;
    font-weight:bold;
    color:#0a8f4d;
}

#acceptOrderBtn{
    width:100%;
    background:#0a8f4d;
    color:#fff;
    border:none;
    border-radius:16px;
    padding:22px;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
}
</style>
<link rel="apple-touch-icon" href="imagenes/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lobo24">
</head>

<body>

<header>
    <h1>📦 Pedidos en Vivo</h1>
    <div id="pedidoCount">0 pedidos</div>
</header>

<div class="container">

    <div id="pedidosContainer" class="pedidos-grid"></div>

    <div id="emptyState" class="empty">
        No hay pedidos pendientes
    </div>

</div>

<!-- Los navegadores bloquean el audio hasta que hay un toque del usuario -->
<div id="soundGate">
    <div class="gate-box">
        <div class="gate-icon">🔔</div>
        <h2>Activar alertas de pedidos</h2>
        <p>Tocá el botón para que suene la alarma cuando entre un pedido nuevo. Dejá esta pantalla abierta.</p>
        <button id="enableAlertsBtn">ACTIVAR SONIDO</button>
    </div>
</div>

<div id="alertModal" role="alertdialog" aria-live="assertive">
    <div class="alert-box">
        <div class="alert-icon">🚨</div>
        <h2>¡NUEVO PEDIDO!</h2>
        <div id="alertExtra" class="alert-extra"></div>
        <div id="alertBody" class="alert-body"></div>
        <button id="acceptOrderBtn">✅ ACEPTAR PEDIDO</button>
    </div>
</div>

<script type="module" src="./pedidos-live.js?v=3"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>

</body>
</html>
