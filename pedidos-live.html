<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta property="og:image" content="https://lobo24-9e46b.web.app/imagenes/iconoLobo24.png">

<title>Pedidos en Vivo | Lobo24</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="imagenes/iconoLobo24.png">

<style>

:root{
    --bg:#0f0f14;
    --bg2:#181822;
    --card:#1f1f2b;
    --border:#2f2f40;
    --accent:#f0c040;
    --green:#35d07f;
    --red:#ff5d5d;
    --text:#f5f5f5;
    --muted:#999;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
}

html.panel-abierto{
    overflow:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
}

button{
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
}

button:focus-visible,
a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
}

header{
    padding:calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px));
    border-bottom:1px solid var(--border);
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:space-between;
    align-items:center;
    background:#111;
}

header h1{
    font-size:28px;
    color:var(--accent);
}

.header-der{
    display:flex;
    align-items:center;
    gap:10px;
}

#pedidoCount{
    background:var(--accent);
    color:#000;
    padding:6px 12px;
    border-radius:10px;
    font-weight:bold;
}

.btn-hist{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:40px;
    padding:8px 14px;
    background:var(--bg2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    font:inherit;
    font-weight:bold;
    cursor:pointer;
    transition:transform 140ms var(--ease-out), border-color 160ms ease;
}

.btn-hist i{
    color:var(--accent);
}

.btn-hist:active{
    transform:scale(.97);
}

@media (max-width:520px){
    header h1{
        font-size:22px;
    }
    .header-der{
        width:100%;
        justify-content:space-between;
    }
}

.container{
    padding:20px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}

.pedidos-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.pedido-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    position:relative;
}

/* La etiqueta va arriba del número: si quedaba encima, en tarjetas
   angostas tapaba el número de pedido. */
.status{
    display:inline-block;
    margin-bottom:8px;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.status.pendiente{
    background:#ff9800;
    color:#000;
}

.status.preparacion{
    background:#2196f3;
}

.status.entregado{
    background:var(--green);
    color:#000;
}

.pedido-card h2{
    margin-bottom:10px;
    color:var(--accent);
}

.info{
    margin-bottom:8px;
    color:#ddd;
}

.info.fecha{
    color:var(--muted);
    font-size:13px;
}

.pickup-badge{
    display:inline-block;
    background:var(--accent);
    color:#000;
    font-weight:bold;
    font-size:12px;
    padding:4px 10px;
    border-radius:8px;
    margin-bottom:10px;
}

.mp-note{
    margin:10px 0;
    padding:10px 12px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
}

.mp-note.mp-wait{
    background:rgba(255,93,93,.12);
    border:1px solid rgba(255,93,93,.3);
    color:var(--red);
}

.mp-note.mp-ok{
    background:rgba(53,208,127,.12);
    border:1px solid rgba(53,208,127,.3);
    color:var(--green);
}

.total{
    font-size:26px;
    font-weight:bold;
    margin:15px 0;
    color:var(--green);
}

.items{
    margin-top:10px;
    border-top:1px solid var(--border);
    padding-top:10px;
}

.item{
    margin-bottom:6px;
    color:#ccc;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.actions button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:transform 140ms var(--ease-out), opacity 160ms ease;
}

.actions button:active{
    transform:scale(.97);
}

.btn-prep{
    background:#2196f3;
    color:#fff;
}

.btn-entregado{
    background:var(--green);
    color:#000;
}

.actions.actions-sec{
    margin-top:10px;
}

.btn-sec,
.btn-peligro{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:44px;
    padding:10px 14px;
    border-radius:10px;
    font:inherit;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    background:transparent;
    transition:transform 140ms var(--ease-out), background-color 160ms ease;
}

.actions .btn-sec,
.actions .btn-peligro{
    padding:10px;
}

.btn-sec{
    color:var(--text);
    border:1px solid var(--border);
}

.btn-peligro{
    color:var(--red);
    border:1px solid rgba(255,93,93,.4);
}

.btn-sec:active,
.btn-peligro:active{
    transform:scale(.97);
}

@media (hover:hover) and (pointer:fine){
    .actions button:hover{
        opacity:.85;
    }
    .btn-hist:hover{
        border-color:var(--accent);
    }
    .btn-sec:hover{
        background:rgba(255,255,255,.06);
    }
    .btn-peligro:hover{
        background:rgba(255,93,93,.1);
    }
    .hist-fila:hover{
        border-color:#4a4a60;
    }
    .hist-icon-btn:hover,
    .hist-mas:hover{
        background:rgba(255,255,255,.06);
    }
}

/* Tiempo de espera de cada pedido abierto */
.espera{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
    padding:4px 10px;
    border-radius:8px;
    background:rgba(255,255,255,.06);
    color:#ccc;
    font-size:13px;
    font-weight:bold;
    font-variant-numeric:tabular-nums;
}

.espera.aviso{
    background:rgba(255,152,0,.16);
    color:#ffb74d;
}

.espera.demora{
    background:rgba(255,93,93,.16);
    color:var(--red);
}

/* Etiquetas de estado del historial */
.chip{
    display:inline-block;
    padding:3px 8px;
    border-radius:6px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.chip.pendiente{ background:#ff9800; color:#000; }
.chip.sinpagar{ background:#2f2f40; color:#ccc; }
.chip.preparacion{ background:#2196f3; color:#fff; }
.chip.entregado{ background:var(--green); color:#000; }
.chip.cancelado{ background:rgba(255,93,93,.15); color:var(--red); box-shadow:inset 0 0 0 1px rgba(255,93,93,.35); }

/* Panel lateral del historial */
.hist-backdrop{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(0,0,0,.55);
    opacity:0;
    visibility:hidden;
    transition:opacity 200ms ease, visibility 0s linear 200ms;
}

.hist-backdrop.open{
    opacity:1;
    visibility:visible;
    transition:opacity 280ms ease, visibility 0s;
}

.hist-panel{
    position:fixed;
    top:0;
    right:0;
    z-index:60;
    width:min(460px, 100%);
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg2);
    border-left:1px solid var(--border);
    box-shadow:-24px 0 48px rgba(0,0,0,.35);
    transform:translateX(100%);
    visibility:hidden;
    touch-action:pan-y;
    transition:transform 200ms var(--ease-drawer), visibility 0s linear 200ms;
}

.hist-panel.open{
    transform:translateX(0);
    visibility:visible;
    transition:transform 280ms var(--ease-drawer), visibility 0s;
}

.hist-panel.arrastrando{
    transition:none;
}

.hist-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 12px 16px;
    border-bottom:1px solid var(--border);
}

.hist-head h2{
    flex:1;
    font-size:18px;
    color:var(--accent);
}

.hist-icon-btn{
    flex:none;
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    border:1px solid var(--border);
    border-radius:10px;
    background:transparent;
    color:var(--text);
    font-size:17px;
    cursor:pointer;
    transition:transform 140ms var(--ease-out), background-color 160ms ease;
}

.hist-icon-btn:active{
    transform:scale(.95);
}

.hist-icon-btn[hidden]{
    display:none;
}

.hist-body{
    flex:1;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:4px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 16px;
}

.hist-body[hidden]{
    display:none;
}

.hist-resumen{
    margin:12px 0 4px;
    color:var(--muted);
    font-size:13px;
}

.hist-vacio{
    padding:48px 0;
    text-align:center;
    color:var(--muted);
}

.hist-dia h3{
    position:sticky;
    top:0;
    z-index:1;
    padding:12px 0 8px;
    background:var(--bg2);
    color:var(--muted);
    font-size:13px;
}

.hist-dia ul{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:8px;
}

.hist-fila{
    width:100%;
    display:grid;
    grid-template-columns:auto minmax(0, 1fr) auto;
    grid-template-areas:
        "hora cliente total"
        "hora estado  estado"
        "hora meta    meta";
    align-items:center;
    gap:5px 12px;
    padding:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    font:inherit;
    text-align:left;
    cursor:pointer;
    transition:transform 140ms var(--ease-out), border-color 160ms ease;
}

.hist-fila:active{
    transform:scale(.98);
}

.hist-hora{
    grid-area:hora;
    color:var(--muted);
    font-size:13px;
    font-weight:bold;
    font-variant-numeric:tabular-nums;
}

.hist-cliente,
.hist-meta{
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.hist-cliente{
    grid-area:cliente;
    font-weight:bold;
}

.hist-total{
    grid-area:total;
    font-weight:bold;
    font-variant-numeric:tabular-nums;
    text-align:right;
}

.hist-estado{
    grid-area:estado;
    justify-self:start;
}

.hist-meta{
    grid-area:meta;
    color:var(--muted);
    font-size:12px;
}

.hist-meta .fa-star{
    color:var(--accent);
}

.hist-mas{
    width:100%;
    min-height:44px;
    margin-top:8px;
    border:1px dashed var(--border);
    border-radius:12px;
    background:transparent;
    color:var(--text);
    font:inherit;
    font-weight:bold;
    cursor:pointer;
    transition:background-color 160ms ease;
}

/* Detalle de un pedido dentro del panel */
.det-cabecera{
    padding:16px 0 14px;
    border-bottom:1px solid var(--border);
}

.det-id{
    margin:10px 0 4px;
    color:var(--accent);
    font-size:22px;
    word-break:break-all;
}

.det-cuando{
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

.det-bloque{
    padding:14px 0;
    border-bottom:1px solid var(--border);
}

.det-bloque h4{
    margin-bottom:8px;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
}

.det-dato{
    margin-bottom:4px;
    color:#ddd;
    line-height:1.4;
}

.det-dato.fuerte{
    color:var(--text);
    font-weight:bold;
}

.det-dato.apagado{
    color:var(--muted);
    font-size:13px;
}

.det-tel{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:44px;
    color:var(--accent);
    font-size:17px;
    font-weight:bold;
    text-decoration:none;
}

.det-items{
    list-style:none;
}

.det-items li{
    display:grid;
    grid-template-columns:auto minmax(0, 1fr) auto;
    gap:10px;
    padding:8px 0;
    border-bottom:1px dashed var(--border);
}

.det-qty{
    color:var(--accent);
    font-weight:bold;
    font-variant-numeric:tabular-nums;
}

.det-prod small{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:12px;
}

.det-linea{
    font-variant-numeric:tabular-nums;
}

.det-totales{
    display:grid;
    grid-template-columns:1fr auto;
    gap:6px 12px;
    margin-top:12px;
    font-variant-numeric:tabular-nums;
}

.det-totales dt{
    color:var(--muted);
}

.det-totales dd{
    text-align:right;
}

.det-totales .det-total{
    margin-top:4px;
    color:var(--green);
    font-size:20px;
    font-weight:bold;
}

.det-nota{
    padding:10px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    color:#ddd;
    line-height:1.4;
    white-space:pre-wrap;
}

.det-acciones{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding-top:16px;
}

.det-acciones button{
    flex:1 1 160px;
}

/* Confirmación para cancelar */
.confirm-modal{
    position:fixed;
    inset:0;
    z-index:70;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.6);
}

.confirm-modal.show{
    display:flex;
}

.confirm-box{
    width:min(440px, 100%);
    max-height:90vh;
    overflow:auto;
    padding:22px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
}

.confirm-modal.show .confirm-box{
    animation:confirmEntrar 200ms var(--ease-out);
}

@keyframes confirmEntrar{
    from{ opacity:0; transform:scale(.96); }
}

.confirm-box h2{
    margin-bottom:6px;
    color:var(--text);
    font-size:20px;
    word-break:break-word;
}

.confirm-cliente{
    margin-bottom:12px;
    color:var(--muted);
}

.confirm-box ul{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding-left:18px;
    color:#ddd;
    line-height:1.4;
}

.confirm-error{
    margin-top:12px;
    color:var(--red);
    font-weight:bold;
}

.confirm-error:empty{
    display:none;
}

.confirm-acciones{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
}

.confirm-acciones button{
    flex:1 1 150px;
}

.btn-peligro.lleno{
    background:var(--red);
    color:#000;
    border-color:var(--red);
}

.confirm-acciones button:disabled{
    opacity:.6;
    cursor:default;
}

@media (prefers-reduced-motion:reduce){
    .hist-panel,
    .hist-panel.open{
        transform:none;
    }
    .hist-panel{
        opacity:0;
        transition:opacity 200ms ease, visibility 0s linear 200ms;
    }
    .hist-panel.open{
        opacity:1;
        transition:opacity 200ms ease, visibility 0s;
    }
    .confirm-modal.show .confirm-box{
        animation:none;
    }
}

/* Comanda para imprimir: solo se ve en papel */
#printArea{
    display:none;
}

@media print{
    @page{ margin:6mm; }
    html,
    body{
        background:#fff;
        color:#000;
    }
    body > *:not(#printArea){
        display:none !important;
    }
    #printArea{
        display:block;
    }
    .tk{
        width:72mm;
        max-width:100%;
        color:#000;
        font:12px/1.4 Arial, Helvetica, sans-serif;
    }
    .tk-logo{
        font-size:20px;
        font-weight:bold;
        letter-spacing:.08em;
        text-align:center;
    }
    .tk-id{
        margin-top:4px;
        font-size:15px;
        font-weight:bold;
        text-align:center;
    }
    .tk-fecha{
        text-align:center;
    }
    .tk-sep{
        margin:8px 0;
        border-top:1px dashed #000;
    }
    .tk-grande{
        margin:2px 0 6px;
        font-size:14px;
        font-weight:bold;
    }
    .tk table{
        width:100%;
        border-collapse:collapse;
    }
    .tk td{
        padding:2px 0;
        vertical-align:top;
    }
    .tk-check{
        width:16px;
    }
    .tk-qty{
        width:24px;
        font-weight:bold;
    }
    .tk-marca-prod{
        color:#444;
        font-size:11px;
    }
    .tk-num{
        text-align:right;
        white-space:nowrap;
        padding-left:6px;
    }
    .tk-total td{
        padding-top:4px;
        font-size:14px;
        font-weight:bold;
    }
}

.empty{
    text-align:center;
    margin-top:80px;
    color:var(--muted);
    font-size:18px;
}

#soundGate,
#alertModal{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
}

#soundGate{
    background:rgba(0,0,0,.92);
}

#soundGate.show,
#alertModal.show{
    display:flex;
}

.gate-box{
    max-width:420px;
}

.gate-icon{
    font-size:64px;
    margin-bottom:10px;
}

.gate-box p{
    color:#ccc;
    margin:12px 0 22px;
    line-height:1.4;
}

#enableAlertsBtn{
    background:var(--accent);
    color:#000;
    border:none;
    border-radius:14px;
    padding:18px 32px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#alertModal{
    background:#d50000;
    animation:alertFlash .7s steps(1) infinite;
}

@keyframes alertFlash{
    0%{ background:#d50000; }
    50%{ background:#ff9800; }
}

.alert-box{
    background:#fff;
    color:#111;
    border-radius:24px;
    padding:28px 24px;
    width:min(560px,100%);
    max-height:92vh;
    overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    animation:alertShake .6s ease-in-out infinite;
}

@keyframes alertShake{
    0%,100%{ transform:translateX(0) scale(1); }
    25%{ transform:translateX(-6px) scale(1.02); }
    75%{ transform:translateX(6px) scale(1.02); }
}

.alert-icon{
    font-size:72px;
    line-height:1;
}

.alert-box h2{
    font-size:38px;
    color:#d50000;
    margin:8px 0 14px;
}

.alert-extra{
    font-weight:bold;
    color:#b71c1c;
    margin-bottom:8px;
}

.alert-body{
    font-size:20px;
    line-height:1.5;
    margin-bottom:22px;
}

.alert-body .alert-total{
    font-size:34px;
    font-weight:bold;
    color:#0a8f4d;
}

#acceptOrderBtn{
    width:100%;
    background:#0a8f4d;
    color:#fff;
    border:none;
    border-radius:16px;
    padding:22px;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
}
</style>
<link rel="apple-touch-icon" href="imagenes/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lobo24">
</head>

<body>

<header>
    <h1>📦 Pedidos en Vivo</h1>
    <div class="header-der">
        <div id="pedidoCount">0 pedidos</div>
        <button type="button" id="histOpenBtn" class="btn-hist" aria-controls="histPanel" aria-expanded="false">
            <i class="fas fa-clock-rotate-left" aria-hidden="true"></i> Historial
        </button>
    </div>
</header>

<div class="container">

    <div id="pedidosContainer" class="pedidos-grid"></div>

    <div id="emptyState" class="empty">
        No hay pedidos pendientes
    </div>

</div>

<!-- Los navegadores bloquean el audio hasta que hay un toque del usuario -->
<div id="soundGate">
    <div class="gate-box">
        <div class="gate-icon">🔔</div>
        <h2>Activar alertas de pedidos</h2>
        <p>Tocá el botón para que suene la alarma cuando entre un pedido nuevo. Dejá esta pantalla abierta.</p>
        <button id="enableAlertsBtn">ACTIVAR SONIDO</button>
    </div>
</div>

<!-- Historial: todos los pedidos (abiertos, entregados y cancelados) -->
<div id="histBackdrop" class="hist-backdrop"></div>
<aside id="histPanel" class="hist-panel" role="dialog" aria-modal="true" aria-labelledby="histTitle" aria-hidden="true" inert>
    <div class="hist-head">
        <button type="button" id="histBackBtn" class="hist-icon-btn" aria-label="Volver a la lista" hidden>
            <i class="fas fa-arrow-left" aria-hidden="true"></i>
        </button>
        <h2 id="histTitle">Historial de pedidos</h2>
        <button type="button" id="histCloseBtn" class="hist-icon-btn" aria-label="Cerrar historial">
            <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
    </div>
    <div id="histList" class="hist-body"></div>
    <div id="histDetail" class="hist-body" hidden></div>
</aside>

<div id="cancelModal" class="confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="cancelTitle">
    <div class="confirm-box">
        <h2 id="cancelTitle">¿Cancelar el pedido?</h2>
        <div id="cancelText"></div>
        <p id="cancelError" class="confirm-error" role="alert"></p>
        <div class="confirm-acciones">
            <button type="button" id="cancelNoBtn" class="btn-sec">No, volver</button>
            <button type="button" id="cancelYesBtn" class="btn-peligro lleno">Sí, cancelar pedido</button>
        </div>
    </div>
</div>

<div id="printArea"></div>

<div id="alertModal" role="alertdialog" aria-live="assertive">
    <div class="alert-box">
        <div class="alert-icon">🚨</div>
        <h2>¡NUEVO PEDIDO!</h2>
        <div id="alertExtra" class="alert-extra"></div>
        <div id="alertBody" class="alert-body"></div>
        <button id="acceptOrderBtn">✅ ACEPTAR PEDIDO</button>
    </div>
</div>

<script type="module" src="./pedidos-live.js?v=5"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>

</body>
</html>
